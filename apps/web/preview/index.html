<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="./assets/icon-192.png" />
<link rel="apple-touch-icon" href="./assets/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>DSH · 手机</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f9fafb; --line:#ebedf0; --line-2:#e3e5e8;
    --text:#0f1115; --text-2:#61666b; --text-3:#8b9099;
    --accent:#3970e5; --accent-2:#6b8cff; --accent-soft:#eef3fe; --accent-ink:#2b4fd0;
    --green:#1a7f37; --red:#c62828; --hover:#f5f6f8; --code:#f6f7f9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
    transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,0,1)}
  .screen.active{transform:none}
  #list{transform:none;background:var(--panel)}
  #chat{background:var(--bg)}

  /* 顶栏 */
  .top{flex:none;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bg);
    border-bottom:1px solid var(--line);position:relative;z-index:4}
  #chat .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,#cfddfb,transparent)}
  .top h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:32px;height:32px;border:0;background:none;color:var(--text);
    display:grid;place-items:center;border-radius:8px;flex:none;padding:0}
  .icon-btn:active{background:var(--hover)}
  .icon-btn svg{width:19px;height:19px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  .pill{font-size:12px;color:var(--text-2);background:var(--bg);border:1px solid var(--line-2);
    border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:#22a06b}
  .dot.pulse{animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.3}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  /* 品牌头 */
  .hero{flex:none;display:flex;align-items:center;gap:11px;
    padding:calc(env(safe-area-inset-top) + 16px) 16px 12px;
    background:linear-gradient(180deg,#eaf1ff 0%,#f4f7fe 58%,var(--panel) 100%);
    position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;
    border-radius:50%;background:radial-gradient(circle,rgba(107,140,255,.22),transparent 68%)}
  .logo{width:40px;height:40px;border-radius:12px;flex:none;object-fit:cover;background:#fff;
    border:1px solid rgba(15,17,21,.07);box-shadow:0 3px 10px rgba(16,24,40,.12);
    animation:float 6s ease-in-out infinite}
  .wordmark{display:flex;flex-direction:column;gap:1px;min-width:0}
  .wordmark .name{font-size:16.5px;font-weight:650;letter-spacing:-.1px;line-height:1.2;
    color:var(--text);white-space:nowrap}
  .wordmark .sub{font-size:11.5px;color:#6a7590;letter-spacing:.2px}
  .hero .pill{margin-left:auto;background:#fff;border-color:#dbe3f5;color:#3a4a6b;position:relative;z-index:1}

  /* 会话列表 */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ws-tabs{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none;background:var(--panel)}
  .ws-tabs::-webkit-scrollbar{display:none}
  .ws-tab{flex:none;font-size:12.5px;color:var(--text-2);padding:5px 10px;border-radius:7px;
    white-space:nowrap;display:flex;align-items:center;gap:6px}
  .ws-tab .k{width:6px;height:6px;border-radius:50%;flex:none;background:#c3c8d0}
  .ws-tab.on .k{box-shadow:0 0 0 3px rgba(57,112,229,.12)}
  .ws-tab.on{color:var(--text);background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06);font-weight:550}
  .group{padding:14px 16px 4px;font-size:11.5px;color:var(--text-3);letter-spacing:.3px}
  .row{display:flex;gap:10px;padding:10px 14px;align-items:center;background:var(--panel)}
  .row:active{background:#f0f2f4}
  .row .cap{width:26px;height:26px;border-radius:7px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;flex:none;color:var(--text-2)}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:14.5px;font-weight:500;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .row .s{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:2px;line-height:1.4}
  .row .meta{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .row .time{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .tag{font-size:10.5px;padding:1px 6px;border-radius:5px;line-height:1.5}
  .tag.run{color:#8a5a00;background:#fdf3e0}
  .tag.wait{color:#a12b26;background:#fdecea}
  .tag.unread{color:#fff;background:var(--accent);border-radius:9px;min-width:17px;text-align:center}

  /* 对话 */
  .msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 4px;
    display:flex;flex-direction:column;gap:18px}
  .u{align-self:flex-end;max-width:86%;background:var(--accent-soft);color:#17233d;border-radius:14px;padding:9px 13px;
    white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
  .a{align-self:stretch;font-size:15px;line-height:1.68}
  .a p{margin:0 0 10px} .a p:last-child{margin:0}
  .a ul{margin:6px 0;padding-left:19px} .a li{margin:2px 0}
  .a strong{font-weight:600}
  .a code{font:13px/1.5 var(--mono);background:var(--code);border-radius:5px;padding:1px 5px}
  .a pre{background:var(--code);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;overflow-x:auto;margin:10px 0;font:12.5px/1.65 var(--mono)}
  .a pre code{background:none;padding:0}
  .think{color:var(--text-3);font-size:13.5px;line-height:1.6;border-left:2px solid var(--line-2);
    padding-left:11px;margin:-4px 0 0}
  .think b{font-weight:600;color:var(--text-2)}

  /* 工具行 */
  .tool{border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
  .tool-h{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:13px;line-height:1.4}
  .tool-h .chev{width:13px;height:13px;color:var(--text-3);transition:transform .18s;flex:none}
  .tool.open .chev{transform:rotate(90deg)}
  .tool-name{color:var(--text-2)}
  .tool-name b{font-weight:550;color:var(--text)}
  .tool-st{margin-left:auto;font-size:11.5px;color:var(--text-3);flex:none}
  .tool-st.run{color:#8a5a00}
  .tool-out{display:none;border-top:1px solid var(--line);background:var(--code);
    padding:10px 12px;font:12px/1.6 var(--mono);color:#40454d;white-space:pre-wrap;max-height:190px;overflow:auto}
  .tool.open .tool-out{display:block}

  /* diff 卡片 */
  .diff{border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .diff-h{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;background:#fcfcfd}
  .diff-h .stat{color:var(--text-3);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
  .f-row{display:flex;align-items:center;gap:8px;padding:8px 12px;font:12.5px/1.5 var(--mono);
    border-top:1px solid var(--line);color:#33383f}
  .f-row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .add{color:var(--green)} .del{color:var(--red);opacity:.55}

  /* 输入区 */
  .composer{flex:none;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:var(--bg);border-top:1px solid var(--line)}
  .box{border:1px solid var(--line-2);border-radius:14px;background:#fff;
    box-shadow:0 1px 2px rgba(16,24,40,.04);padding:9px 10px 8px}
  .box textarea{width:100%;border:0;outline:none;resize:none;font:15px/1.5 inherit;color:var(--text);
    background:none;max-height:110px;min-height:24px;padding:1px 2px}
  .box textarea::placeholder{color:var(--text-3)}
  .bar{display:flex;align-items:center;gap:6px;margin-top:7px}
  .chip{font-size:11.5px;color:var(--text-2);border:1px solid var(--line-2);border-radius:7px;
    padding:3px 7px;white-space:nowrap;display:flex;align-items:center;gap:4px;background:#fff}
  .chip.acc{color:var(--accent);border-color:#cddcfb;background:var(--accent-soft)}
  .spin{width:11px;height:11px;border:1.5px solid #c9ced6;border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .send{margin-left:auto;width:32px;height:32px;border-radius:50%;border:0;
    background:linear-gradient(140deg,var(--accent-2),var(--accent-ink));
    color:#fff;display:grid;place-items:center;flex:none;transition:opacity .15s}
  .send:disabled{background:#d7dae0}
  .send svg{width:16px;height:16px}

  /* 审批 */
  .scrim{position:fixed;inset:0;background:rgba(15,17,21,.32);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:20}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;
    border-radius:18px 18px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(110%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -8px 30px rgba(16,24,40,.12)}
  .sheet.on{transform:none}
  .sheet .grab{width:34px;height:4px;border-radius:2px;background:#e3e5e8;margin:-8px auto 14px}
  .sheet h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
  .cd{margin-left:auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .sheet .desc{color:var(--text-2);font-size:13.5px;margin:6px 0 14px;line-height:1.55}
  .facts{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px}
  .fact{display:flex;gap:10px;padding:9px 12px;font-size:13px;border-top:1px solid var(--line)}
  .fact:first-child{border-top:0}
  .fact .k{color:var(--text-3);width:38px;flex:none}
  .fact .v{color:var(--text);flex:1;word-break:break-all}
  .note{font-size:12px;color:var(--text-3);margin:0 0 14px}
  .acts{display:flex;gap:10px}
  .btn{flex:1;height:44px;border-radius:11px;border:1px solid var(--line-2);background:#fff;
    color:var(--text);font:15px/1 inherit;font-weight:550}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:active{opacity:.85}

  .empty{color:var(--text-3);font-size:13px;text-align:center;padding:40px 0}
</style>
</head>
<body>

<section id="list" class="screen active">
  <div class="hero">
    <img class="logo" src="./assets/icon-192.png" alt="DeepSeek Harness" />
    <div class="wordmark">
      <span class="name">DeepSeek Harness</span>
      <span class="sub">手机遥控器</span>
    </div>
    <span class="pill"><span class="dot"></span>已连接</span>
  </div>
  <div class="ws-tabs">
    <div class="ws-tab on"><i class="k" style="background:#3970e5"></i>E:\workspace</div>
    <div class="ws-tab"><i class="k" style="background:#7c5cff"></i>person</div>
    <div class="ws-tab"><i class="k" style="background:#e0653a"></i>book-video</div>
    <div class="ws-tab"><i class="k" style="background:#16a34a"></i>quant</div>
  </div>
  <div class="scroll"><div id="sessionList"></div></div>
</section>

<section id="chat" class="screen">
  <div class="top">
    <button class="icon-btn" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="chatTitle">会话</h1>
    <div class="right"><span class="pill" id="chatState">就绪</span></div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="发消息或分配任务…"></textarea>
      <div class="bar">
        <span class="chip">＋</span>
        <span class="chip">工作区内修改</span>
        <span class="chip acc"><span class="spin"></span>DeepSeek-V4.1-Flash</span>
        <button class="send" id="sendBtn" disabled aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3><span style="width:8px;height:8px;border-radius:50%;background:#e0a03a;box-shadow:0 0 0 4px rgba(224,160,58,.16)"></span>需要确认 <span class="cd" id="cd">15s</span></h3>
  <div class="desc">bash 请求在工作区外执行命令。允许只对本次生效。</div>
  <div class="facts">
    <div class="fact"><span class="k">工具</span><span class="v">bash</span></div>
    <div class="fact"><span class="k">命令</span><span class="v" style="font-family:var(--mono);font-size:12.5px">echo "构建完成" &gt;&gt; E:\workspace\tmp\build.log</span></div>
    <div class="fact"><span class="k">会话</span><span class="v">鸿蒙遥控器方案评估</span></div>
  </div>
  <p class="note">15 秒内不处理，将自动交给桌面端。</p>
  <div class="acts">
    <button class="btn" id="denyBtn">拒绝</button>
    <button class="btn primary" id="allowBtn">允许一次</button>
  </div>
</div>

<script>
const SESSIONS = [
  { id:'s1', title:'把这条口播稿按对标改写', ws:'E:\\workspace', state:'run', preview:'正在写第 3 段…', time:'刚刚', unread:0 },
  { id:'s2', title:'鸿蒙遥控器方案评估', ws:'E:\\workspace', state:'wait', preview:'等待确认：bash 写入 build.log', time:'2 分钟', unread:1 },
  { id:'s3', title:'小红书关键词情报', ws:'person', state:'idle', preview:'已生成 12 个长尾词，报告在 outputs/', time:'1 小时', unread:0 },
  { id:'s4', title:'拼豆图纸色号映射', ws:'person', state:'idle', preview:'CIEDE2000 映射完成，33 色', time:'昨天', unread:0 },
  { id:'s5', title:'DSH 插件开发', ws:'E:\\workspace', state:'idle', preview:'插件骨架已跑通', time:'昨天', unread:0 },
];

const SCRIPTS = {
  s2: [
    { type:'user', text:'鸿蒙原生客户端，审批这块怎么设计？' },
    { type:'ai', text:'审批是 waterfall 事件，手机要接就得实现 `$events` 流和 `$events/result` 回调。建议桌面侧加一个 bridge 插件，手机只调普通 HTTP：\n\n- 插件先应答，等手机 15 秒\n- 超时就交给桌面接手\n- 手机端完全不碰事件流\n\n这样桌面行为不变，手机掉了也不影响任务。' },
    { type:'tool', name:'bash', desc:'正在运行命令 · 检查端口占用', status:'run', out:'$ netstat -ano | findstr :8788' },
  ],
  s1: [
    { type:'user', text:'把这条口播稿按对标改写，深度改写，保留钩子。' },
    { type:'think', text:'先看对标稿结构：钩子 → 冲突 → 转折 → 收束。原文缺第二段冲突，需要在 120 字内补一个具体场景。' },
    { type:'tool', name:'read_file', desc:'读取 对标/林徽因.txt', status:'ok', out:'4.2 KB' },
    { type:'diff', files:[['人物故事带货/对标/林徽因.txt',383,0],['人物故事带货/对标/林徽因.notes.md',28,0]] },
    { type:'ai', text:'改好了，核心改了三处：\n\n1. **开头钩子换成场景**，不再用设问句；\n2. 第二段补了一个具体冲突，把"她为什么不走"变成动作；\n3. 结尾收在意象上，不点题。\n\n```text\n那年她站在站台上，风把信纸吹得哗哗响。\n```\n\n要我再出一版更狠的吗？' },
  ],
};

const $ = s => document.querySelector(s);
const listEl = $('#sessionList'), msgsEl = $('#msgs'), inputEl = $('#input'), sendBtn = $('#sendBtn');
const state = { timers:[], cd:null };

function tagOf(s){
  if (s.state === 'run') return '<span class="tag run">运行中</span>';
  if (s.state === 'wait') return '<span class="tag wait">待确认</span>';
  if (s.unread) return `<span class="tag unread">${s.unread}</span>`;
  return '';
}
function renderList(){
  const groups = {};
  SESSIONS.forEach(s => (groups[s.ws] ??= []).push(s));
  listEl.innerHTML = Object.entries(groups).map(([ws, rows]) => `
    <div class="group">${ws}</div>
    ${rows.map(s => `
      <div class="row" data-id="${s.id}">
        <div class="cap">${s.state==='run'?'◐':'▤'}</div>
        <div class="body"><div class="t">${s.title}</div><div class="s">${s.preview}</div></div>
        <div class="meta"><span class="time">${s.time}</span>${tagOf(s)}</div>
      </div>`).join('')}`).join('');
  listEl.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => openChat(r.dataset.id)));
}

function md(src){
  let s = src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c.replace(/^\n/,'')}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^\d+\.\s+(.*)$/gm, '<li>$1</li>').replace(/^[-*]\s+(.*)$/gm, '<li>$1</li>');
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  return s.split(/\n{2,}/).map(p => /^<(pre|ul)/.test(p) ? p : `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

function addMsg(it){
  const el = document.createElement('div');
  if (it.type === 'user'){ el.className='u'; el.textContent=it.text }
  else if (it.type === 'ai'){ el.className='a'; el.innerHTML = md(it.text) + (it.streaming?'<span style="display:inline-block;width:6px;height:15px;background:var(--accent);vertical-align:-2px"></span>':'') }
  else if (it.type === 'think'){ el.className='think'; el.innerHTML = '<b>思考</b> · ' + it.text }
  else if (it.type === 'tool'){
    el.className = 'tool' + (it.status==='run'?' open':'');
    el.innerHTML = `
      <div class="tool-h">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        <span class="tool-name"><b>${it.name}</b> · ${it.desc}</span>
        <span class="tool-st ${it.status}">${it.status==='run'?'运行中':'完成'}</span>
      </div>
      <div class="tool-out">${(it.out||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
    el.querySelector('.tool-h').addEventListener('click', () => el.classList.toggle('open'));
  }
  else if (it.type === 'diff'){
    el.className = 'diff';
    el.innerHTML = `<div class="diff-h"><span>已编辑 ${it.files.length} 个文件</span><span class="stat">${it.files.map(f=>`+${f[1]} −${f[2]}`).join('  ')}</span></div>
      ${it.files.map(f=>`<div class="f-row"><span class="n">${f[0]}</span><span class="add">+${f[1]}</span><span class="del">−${f[2]}</span></div>`).join('')}`;
  }
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return el;
}

function openChat(id){
  const s = SESSIONS.find(x => x.id === id);
  $('#chatTitle').textContent = s.title;
  $('#chatState').textContent = s.state==='run'?'运行中':(s.state==='wait'?'待确认':'就绪');
  msgsEl.innerHTML = '';
  (SCRIPTS[id] || []).forEach(addMsg);
  if (!SCRIPTS[id]) addMsg({ type:'ai', text:'这个会话还没有消息。' });
  $('#list').classList.remove('active'); $('#chat').classList.add('active');
  setTimeout(()=>msgsEl.scrollTop = msgsEl.scrollHeight, 20);
}
$('#backBtn').addEventListener('click', ()=>{
  $('#chat').classList.remove('active'); $('#list').classList.add('active');
  state.timers.forEach(clearTimeout); state.timers=[];
});

inputEl.addEventListener('input', ()=>{
  inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,110)+'px';
  sendBtn.disabled = !inputEl.value.trim();
});
const later = (fn,ms)=>state.timers.push(setTimeout(fn,ms));

sendBtn.addEventListener('click', ()=>{
  const t = inputEl.value.trim(); if(!t) return;
  inputEl.value=''; inputEl.style.height='auto'; sendBtn.disabled=true;
  addMsg({ type:'user', text:t });
  later(()=>addMsg({ type:'think', text:'判断任务类型，选择工具。' }), 420);
  later(()=>{
    const el = addMsg({ type:'tool', name:'bash', desc:'正在运行命令 · 检查工作区', status:'run', out:'> 执行中…' });
    later(()=>{
      el.querySelector('.tool-out').textContent = '$ ls\nbuild  dist  src  package.json';
      const st = el.querySelector('.tool-st'); st.className='tool-st'; st.textContent='完成';
    }, 1300);
  }, 900);
  later(()=>{
    const el = addMsg({ type:'ai', text:'', streaming:true });
    const full='好，按你的要求处理完了。\n\n- 读了对标稿，确认结构和字数\n- 改写三段，保留原钩子\n- 结尾改成动作收束\n\n下一步直接投递出片，还是先看全文？';
    let i=0;
    const tick=setInterval(()=>{ i+=2; el.innerHTML=md(full.slice(0,i)); msgsEl.scrollTop=msgsEl.scrollHeight;
      if(i>=full.length){ clearInterval(tick); el.innerHTML=md(full) } }, 22);
  }, 2300);
  later(()=>openApproval(), 4800);
});

function openApproval(){
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  let left=15; $('#cd').textContent=left+'s';
  clearInterval(state.cd);
  state.cd=setInterval(()=>{ left--; $('#cd').textContent=left+'s'; if(left<=0) closeApproval('expired') },1000);
}
function closeApproval(k){
  clearInterval(state.cd); $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  if(k==='allow') addMsg({ type:'ai', text:'已允许（一次性），继续执行。' });
  if(k==='deny') addMsg({ type:'ai', text:'已拒绝，工具未执行。' });
  if(k==='expired') addMsg({ type:'think', text:'超时，已交给桌面端处理。' });
}
$('#allowBtn').onclick=()=>closeApproval('allow');
$('#denyBtn').onclick=()=>closeApproval('deny');
$('#scrim').onclick=()=>closeApproval('expired');

renderList();
</script>
</body>
</html>
